<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>家庭手账</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card-bg: #ffffff;
      --primary: #c4956a;
      --primary-dark: #a67550;
      --text: #3d2b1f;
      --text-light: #8b7355;
      --border: #ede0d4;
      --success: #6b9b7a;
      --danger: #c0756a;
      --shadow: 0 2px 12px rgba(61,43,31,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; }

    /* ===== LOGIN ===== */
    .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-logo { width: 80px; height: 80px; background: var(--primary); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; font-size: 40px; box-shadow: var(--shadow); }
    .login-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .login-sub { font-size: 14px; color: var(--text-light); margin-bottom: 40px; }
    .login-input { width: 100%; max-width: 280px; height: 56px; border: 2px solid var(--border); border-radius: 16px; font-size: 24px; text-align: center; letter-spacing: 8px; padding: 0 16px; outline: none; transition: border-color 0.2s; background: var(--card-bg); }
    .login-input:focus { border-color: var(--primary); }
    .login-btn { margin-top: 24px; width: 100%; max-width: 280px; height: 52px; background: var(--primary); color: white; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .login-btn:hover { opacity: 0.9; }
    .login-error { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }

    /* ===== APP SHELL ===== */
    .app { display: none; height: 100vh; flex-direction: column; }
    .app.active { display: flex; }

    /* ===== HEADER ===== */
    .header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .header-title { font-size: 18px; font-weight: 700; }
    .header-date { font-size: 12px; color: var(--text-light); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .sync-status { font-size: 12px; padding: 4px 8px; border-radius: 4px; }
    .sync-status.synced { color: var(--success); }
    .sync-status.syncing { color: var(--primary); }
    .sync-status.error { color: var(--danger); }
    .logout-btn { background: none; border: none; color: var(--text-light); font-size: 18px; cursor: pointer; padding: 4px 8px; }

    /* ===== SUMMARY CARDS ===== */
    .summary-section { padding: 20px; background: var(--card-bg); border-bottom: 1px solid var(--border); }
    .summary-total { text-align: center; margin-bottom: 16px; }
    .summary-label { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
    .summary-value { font-size: 32px; font-weight: 700; color: var(--text); }
    .chart-container { display: flex; align-items: center; gap: 16px; }
    .chart-canvas-wrap { flex-shrink: 0; position: relative; }
    .chart-canvas { display: block; }
    .chart-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; color: var(--text-light); text-align: center; pointer-events: none; }
    .chart-legend { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-label { flex: 1; color: var(--text); }
    .legend-value { color: var(--text-light); font-size: 12px; }
    .chart-title { font-size: 12px; color: var(--text-light); margin-bottom: 8px; text-align: center; }

    /* ===== TABS ===== */
    .tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--border); }
    .tab { flex: 1; padding: 14px 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--text-light); border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ===== CONTENT ===== */
    .content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
    .section { display: none; }
    .section.active { display: block; }

    /* ===== CARDS ===== */
    .card-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-title { font-size: 16px; font-weight: 600; }
    .card-owner { font-size: 11px; color: white; background: var(--primary); padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
    .card-amount { font-size: 20px; font-weight: 700; }
    .card-meta { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    .card-actions { display: flex; gap: 8px; margin-top: 12px; }
    .card-btn { flex: 1; padding: 8px 0; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .card-btn:active { opacity: 0.8; }
    .card-btn-edit { background: var(--border); color: var(--text); }
    .card-btn-delete { background: #fef2f2; color: var(--danger); }

    /* ===== FAB ===== */
    .fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: var(--primary); color: white; border: none; border-radius: 28px; font-size: 28px; box-shadow: 0 4px 16px rgba(196,149,106,0.4); cursor: pointer; }
    .fab:active { transform: scale(0.95); opacity: 0.9; }

    /* ===== MODAL ===== */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card-bg); border-radius: 20px; width: 100%; max-width: 360px; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; color: var(--text-light); margin-bottom: 6px; display: block; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--bg); }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .form-actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn { flex: 1; padding: 14px 0; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--border); color: var(--text); }

    /* ===== REPAYMENT ===== */
    .repayment-summary { background: var(--card-bg); padding: 20px; border-bottom: 1px solid var(--border); }
    .repayment-progress { margin-top: 16px; }
    .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--success); border-radius: 4px; }
    .progress-info { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; }
    .repayment-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .repayment-card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
    .repayment-name { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .repayment-detail { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-light); margin-top: 4px; }
    .repayment-detail span:last-child { color: var(--text); font-weight: 600; }

    /* ===== SUMMARY TAB ===== */
    .summary-cards { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .summary-card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
    .summary-card-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .summary-card-row:last-child { border-bottom: none; }
    .summary-card-label { font-size: 14px; color: var(--text-light); }
    .summary-card-value { font-size: 14px; font-weight: 600; }
    .section-title { font-size: 12px; color: var(--text-light); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

    /* ===== TOAST ===== */
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="loginScreen">
  <div class="login-logo">📒</div>
  <div class="login-title">家庭手账</div>
  <div class="login-sub">请输入访问密码</div>
  <input type="password" class="login-input" id="loginInput" maxlength="20" placeholder="密码" />
  <div class="login-error" id="loginError">密码错误</div>
  <button class="login-btn" id="loginBtn">进入</button>

</div>

<!-- App -->
<div class="app" id="app">
  <div class="header">
    <div>
      <div class="header-title">📒 家庭手账</div>
      <div class="header-date" id="headerDate"></div>
    </div>
    <div class="header-actions">
      <span class="sync-status synced" id="syncStatus">☁️ 已同步</span>
      <button class="logout-btn" onclick="logout()" title="退出">🚪</button>
    </div>
  </div>

  <div class="summary-section">
    <div class="summary-total">
      <div class="summary-label">净资产</div>
      <div class="summary-value" id="netWorth">¥0</div>
    </div>
    <div class="chart-container">
      <div class="chart-canvas-wrap">
        <div class="chart-title">资产分布</div>
        <canvas id="assetPie" width="120" height="120"></canvas>
        <div class="chart-center" id="assetPieCenter"></div>
      </div>
      <div class="chart-legend" id="assetLegend"></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="assets">💰 资产</div>
    <div class="tab" data-tab="liabilities">🏦 负债</div>
    <div class="tab" data-tab="summary">📊 汇总</div>
  </div>

  <div class="content">
    <div class="section active" id="assetsSection">
      <div class="card-list" id="assetList"></div>
      <button class="fab" onclick="openModal('asset')">+</button>
    </div>

    <div class="section" id="liabilitiesSection">
      <div class="repayment-summary" id="repaymentSummary"></div>
      <div class="repayment-list" id="liabilityList"></div>
      <button class="fab" onclick="openModal('liability')">+</button>
    </div>

    <div class="section" id="summarySection">
      <div class="summary-cards" id="summaryCards"></div>
    </div>
  </div>
</div>

<!-- Asset Modal -->
<div class="modal-overlay" id="assetModal">
  <div class="modal">
    <div class="modal-title" id="assetModalTitle">添加资产</div>
    <div class="form-group">
      <label class="form-label">持有人</label>
      <select class="form-select" id="assetOwner">
        <option value="蔡伟林">蔡伟林</option>
        <option value="孙泳茵">孙泳茵</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">名称</label>
      <input type="text" class="form-input" id="assetName" placeholder="例如：招商银行" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">金额（万）</label>
        <input type="number" class="form-input" id="assetAmount" step="0.01" placeholder="10.5" />
      </div>
      <div class="form-group">
        <label class="form-label">类型</label>
        <select class="form-select" id="assetType">
          <option value="现金">现金（随时可用）</option>
          <option value="基金">基金</option>
          <option value="股票">股票</option>
          <option value="保险">保险</option>
          <option value="理财">理财（不能随时用）</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <textarea class="form-textarea" id="assetNote" placeholder="选填"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal('asset')">取消</button>
      <button class="btn btn-primary" onclick="saveAsset()">保存</button>
    </div>
  </div>
</div>

<!-- Liability Modal -->
<div class="modal-overlay" id="liabilityModal">
  <div class="modal">
    <div class="modal-title" id="liabilityModalTitle">添加负债</div>
    <div class="form-group">
      <label class="form-label">名称</label>
      <input type="text" class="form-input" id="liabilityName" placeholder="例如：房贷" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">本金（万）</label>
        <input type="number" class="form-input" id="liabilityPrincipal" step="0.01" placeholder="100" />
      </div>
      <div class="form-group">
        <label class="form-label">利率（%）</label>
        <input type="number" class="form-input" id="liabilityRate" step="0.01" placeholder="4.1" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">月利息（万）</label>
        <input type="number" class="form-input" id="liabilityInterest" step="0.01" placeholder="0" />
      </div>
      <div class="form-group">
        <label class="form-label">月还款（万）</label>
        <input type="number" class="form-input" id="liabilityPayment" step="0.01" placeholder="0" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">还款方式</label>
        <select class="form-select" id="liabilityType">
          <option value="先息后本">先息后本</option>
          <option value="本息归还">本息归还</option>
          <option value="仅利息">仅利息</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">更新方式</label>
        <select class="form-select" id="liabilityUpdate">
          <option value="manual">手动</option>
          <option value="auto">自动</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">到期/截止</label>
      <input type="text" class="form-input" id="liabilityDue" placeholder="2035年12月" />
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <textarea class="form-textarea" id="liabilityNote" placeholder="选填"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal('liability')">取消</button>
      <button class="btn btn-primary" onclick="saveLiability()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== 云端配置 ======
// 部署 Cloudflare Worker 后把 URL 填在这里
// 格式: https://xxx.workers.dev
const CLOUD_URL = 'https://family-ledger-sync.14183572.workers.dev';

// ===== DATA =====
const data = {
  assets: [],
  liabilities: [],
  meta: { id: 'main', last_updated: '', next_repayment_target: 70, repayment_amount: 50 }
};

// ===== 初始资产数据 =====
const INITIAL_DATA = {
  assets: [
    {"id": "a1", "owner": "蔡伟林", "name": "只进不出", "amount": 53, "type": "现金", "note": "Lump Sum 还款专用账户", "updated_at": "2026-04-10"},
    {"id": "a2", "owner": "蔡伟林", "name": "招行基金", "amount": 8, "type": "基金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a3", "owner": "蔡伟林", "name": "招行理财", "amount": 12, "type": "理财", "note": "", "updated_at": "2026-04-10"},
    {"id": "a4", "owner": "蔡伟林", "name": "招行现金", "amount": 1.6, "type": "现金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a5", "owner": "蔡伟林", "name": "信诺保险", "amount": 5, "type": "保险", "note": "", "updated_at": "2026-04-10"},
    {"id": "a6", "owner": "孙泳茵", "name": "股票", "amount": 77.2, "type": "股票", "note": "", "updated_at": "2026-04-10"},
    {"id": "a7", "owner": "孙泳茵", "name": "支付宝", "amount": 41.7, "type": "基金", "note": "基金+黄金+余额宝", "updated_at": "2026-04-10"},
    {"id": "a8", "owner": "孙泳茵", "name": "招行基金", "amount": 13.2, "type": "基金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a9", "owner": "孙泳茵", "name": "招行泰康保险", "amount": 36, "type": "保险", "note": "", "updated_at": "2026-04-10"},
    {"id": "a10", "owner": "孙泳茵", "name": "招行快赎", "amount": 6.3, "type": "现金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a11", "owner": "孙泳茵", "name": "农行卡余额", "amount": 6.3, "type": "现金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a12", "owner": "孙泳茵", "name": "招行卡余额", "amount": 5.5, "type": "现金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a13", "owner": "孙泳茵", "name": "东莞银行卡余额", "amount": 5.3, "type": "现金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a14", "owner": "孙泳茵", "name": "微信基金", "amount": 1.3, "type": "基金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a15", "owner": "孙泳茵", "name": "建行基金", "amount": 0.6, "type": "基金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a16", "owner": "孙泳茵", "name": "东莞农商行余额", "amount": 0.6, "type": "现金", "note": "", "updated_at": "2026-04-10"},
    {"id": "a17", "owner": "孙泳茵", "name": "建行卡余额", "amount": 0.06, "type": "现金", "note": "", "updated_at": "2026-04-10"}
  ],
  liabilities: [
    {"id": "l1", "name": "9A抵押贷", "principal": 460, "rate": 3.55, "monthly_interest": 1.36, "monthly_payment": 0, "repayment_type": "先息后本", "update_mode": "manual", "due_date": "每年续期", "note": ""},
    {"id": "l2", "name": "9C抵押贷", "principal": 380, "rate": 3.45, "monthly_interest": 1.09, "monthly_payment": 0, "repayment_type": "先息后本", "update_mode": "manual", "due_date": "3年一续", "note": ""},
    {"id": "l3", "name": "中海房贷", "principal": 320, "rate": 3.2, "monthly_interest": 0, "monthly_payment": 3.2, "repayment_type": "本息归还", "update_mode": "auto", "due_date": "2035年12月", "note": ""}
  ],
  meta: {"last_updated": "2026-04-10", "next_repayment_target": 70, "repayment_amount": 50}
};

let editingAssetId = null;
let editingLiabilityId = null;
let syncInterval = null;

// ===== INIT =====
function init() {
  document.getElementById('loginInput').addEventListener('keyup', e => { if (e.key === 'Enter') checkLogin(); });
  document.getElementById('loginBtn').onclick = checkLogin;
  
  if (localStorage.getItem('ledger_logged_in') === 'true') {
    checkLogin();
  }
}

function checkLogin() {
  const pwd = document.getElementById('loginInput').value;
  if (pwd === '1221') {
    localStorage.setItem('ledger_logged_in', 'true');
    showApp();
  } else {
    document.getElementById('loginError').style.display = 'block';
    setTimeout(() => { document.getElementById('loginError').style.display = 'none'; }, 2000);
  }
}

function logout() {
  localStorage.removeItem('ledger_logged_in');
  stopSync();
  location.reload();
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  loadFromCloud();
  startAutoSync();
}

// ===== CLOUD SYNC =====
async function loadFromCloud() {
  setSyncStatus('syncing', '🔄 同步中');
  
  try {
    const res = await fetch(`${CLOUD_URL}/data`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });
    
    if (res.ok) {
      const cloudData = await res.json();
      // 如果云端数据为空，使用初始数据并上传
      if (!cloudData.assets || cloudData.assets.length === 0) {
        data.assets = INITIAL_DATA.assets;
        data.liabilities = INITIAL_DATA.liabilities;
        data.meta = INITIAL_DATA.meta;
        // 上传到云端
        setTimeout(() => saveToCloud(), 500);
        showToast('📦 初始化数据已加载');
      } else {
        data.assets = cloudData.assets || [];
        data.liabilities = cloudData.liabilities || [];
        data.meta = cloudData.meta || data.meta;
      }
      // 同时保存到本地作为备份
      saveToLocalStorage();
      autoUpdateZhonghai();
      renderAll();
      setSyncStatus('synced', '☁️ 已同步');
    } else {
      throw new Error('Load failed');
    }
  } catch (err) {
    console.error('Cloud load error:', err);
    // 网络失败时加载本地数据
    loadFromLocalStorage();
    renderAll();
    setSyncStatus('error', '⚠️ 离线');
  }
}

async function saveToCloud() {
  // 先保存到本地，防止网络问题丢失
  saveToLocalStorage();
  
  setSyncStatus('syncing', '🔄 保存中');
  
  try {
    const res = await fetch(`${CLOUD_URL}/data`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    
    if (res.ok) {
      setSyncStatus('synced', '☁️ 已同步');
      showToast('✅ 已保存到云端');
    } else {
      throw new Error('Save failed');
    }
  } catch (err) {
    console.error('Cloud save error:', err);
    setSyncStatus('error', '⚠️ 保存失败');
    showToast('⚠️ 网络问题，已暂存本地');
  }
}

function startAutoSync() {
  // 每 30 秒自动同步
  syncInterval = setInterval(() => {
    loadFromCloud();
  }, 30000);
  
  // 页面可见时同步
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      loadFromCloud();
    }
  });
}

function stopSync() {
  if (syncInterval) clearInterval(syncInterval);
}

function setSyncStatus(status, text) {
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  el.className = 'sync-status ' + status;
}

// ===== LOCAL STORAGE (备用) =====
function saveToLocalStorage() {
  localStorage.setItem('ledger_data_backup', JSON.stringify(data));
}

function loadFromLocalStorage() {
  const stored = localStorage.getItem('ledger_data_backup');
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      data.assets = parsed.assets || data.assets;
      data.liabilities = parsed.liabilities || data.liabilities;
      data.meta = parsed.meta || data.meta;
    } catch (e) {}
  }
}

// ===== AUTO UPDATE =====
function autoUpdateZhonghai() {
  const zhonghai = data.liabilities.find(l => l.name === '中海房贷');
  if (!zhonghai || zhonghai.update_mode !== 'auto') return;
  
  const now = new Date();
  const dueDate = new Date('2035-12-01');
  if (now >= dueDate) return;
  
  const monthlyPayment = zhonghai.monthly_payment || 3.2;
  const annualRate = (zhonghai.rate || 3.2) / 100;
  const monthlyInterest = (zhonghai.principal || 0) * annualRate / 12;
  const monthlyPrincipal = monthlyPayment - monthlyInterest;
  
  if (monthlyPrincipal > 0 && zhonghai.principal > 0) {
    zhonghai.principal = Math.max(0, zhonghai.principal - monthlyPrincipal);
  }
}

// ===== RENDER =====
function renderAll() {
  renderHeader();
  renderSummary();
  renderAssetList();
  renderLiabilityList();
  renderSummaryCards();
  renderTabs();
}

function renderHeader() {
  const now = new Date();
  document.getElementById('headerDate').textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
}

function renderSummary() {
  const totalAssets = data.assets.reduce((s, a) => s + (a.amount || 0), 0);
  const totalLiabilities = data.liabilities.reduce((s, l) => s + (l.principal || 0), 0);
  const netWorth = totalAssets - totalLiabilities;
  
  document.getElementById('netWorth').textContent = `¥${netWorth.toFixed(1)}万`;
  document.getElementById('netWorth').className = `summary-value ${netWorth >= 0 ? '' : 'summary-liabilities'}`;
  if (netWorth < 0) document.getElementById('netWorth').style.color = 'var(--danger)';
  else document.getElementById('netWorth').style.color = '';
  
  const ASSET_TYPES = [
    { key: '现金', label: '现金（随时可用）', color: '#e8b87a' },
    { key: '基金', label: '基金', color: '#7a9fc8' },
    { key: '股票', label: '股票', color: '#9b7ac8' },
    { key: '保险', label: '保险', color: '#7ac8a3' },
    { key: '理财', label: '理财（不能随时用）', color: '#c87a7a' },
  ];
  
  const typeValues = ASSET_TYPES.map(t => data.assets.filter(a => a.type === t.key).reduce((s, a) => s + (a.amount || 0), 0));
  const typeItems = ASSET_TYPES.map((t, i) => ({ label: t.label, value: typeValues[i], color: t.color }));
  
  drawPie('assetPie', typeValues, ASSET_TYPES.map(t => t.color), totalAssets, typeItems);
}

function drawPie(canvasId, values, colors, total, items) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx = 60, cy = 60, r = 50;
  
  ctx.clearRect(0, 0, 120, 120);
  
  if (total === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ede0d4';
    ctx.fill();
    document.getElementById(canvasId + 'Center').textContent = '¥0';
    document.getElementById('assetLegend').innerHTML = '';
    return;
  }
  
  let startAngle = -Math.PI / 2;
  values.forEach((v, i) => {
    if (v <= 0) return;
    const slice = (v / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, startAngle + slice);
    ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.fill();
    startAngle += slice;
  });
  
  document.getElementById(canvasId + 'Center').textContent = `¥${total.toFixed(0)}`;
  document.getElementById('assetLegend').innerHTML = items.filter(x => x.value > 0).map(item => `
    <div class="legend-item">
      <span class="legend-dot" style="background:${item.color}"></span>
      <span class="legend-label">${item.label}</span>
      <span class="legend-value">¥${item.value.toFixed(1)}</span>
    </div>
  `).join('');
}

function renderAssetList() {
  const list = document.getElementById('assetList');
  if (!list) return;
  if (data.assets.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);">暂无资产，点击+添加</div>';
    return;
  }
  
  list.innerHTML = data.assets.map(a => `
    <div class="card">
      <div class="card-header">
        <div>
          <span class="card-title">${a.name}</span>
          <span class="card-owner">${a.owner}</span>
        </div>
        <div class="card-amount">¥${(a.amount || 0).toFixed(1)}万</div>
      </div>
      <div class="card-meta">${a.type} ${a.note ? '· ' + a.note : ''}</div>
      <div class="card-actions">
        <button class="card-btn card-btn-edit" onclick="editAsset('${a.id}')">编辑</button>
        <button class="card-btn card-btn-delete" onclick="deleteAsset('${a.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function renderLiabilityList() {
  const totalLiabilities = data.liabilities.reduce((s, l) => s + (l.principal || 0), 0);
  const totalTarget = data.meta.next_repayment_target || 70;
  const progress = Math.min(100, Math.max(0, ((totalTarget - totalLiabilities) / totalTarget) * 100));
  
  document.getElementById('repaymentSummary').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:12px;color:var(--text-light);">剩余负债总额</div>
        <div style="font-size:24px;font-weight:700;color:var(--danger);">¥${totalLiabilities.toFixed(1)}万</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;color:var(--text-light);">本月目标还款</div>
        <div style="font-size:18px;font-weight:600;">¥${data.meta.repayment_amount || 50}万</div>
      </div>
    </div>
    <div class="repayment-progress">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-info">
        <span>距清零还需 ¥${Math.max(0, totalLiabilities - totalTarget).toFixed(1)}万</span>
        <span>${progress.toFixed(0)}%</span>
      </div>
    </div>
  `;
  
  const list = document.getElementById('liabilityList');
  if (!list) return;
  if (data.liabilities.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);">暂无负债</div>';
    return;
  }
  
  list.innerHTML = data.liabilities.map(l => `
    <div class="repayment-card">
      <div class="repayment-name">${l.name}</div>
      <div class="repayment-detail"><span>本金</span><span>¥${(l.principal || 0).toFixed(1)}万</span></div>
      <div class="repayment-detail"><span>利率</span><span>${l.rate || 0}%</span></div>
      <div class="repayment-detail"><span>月利息</span><span>¥${((l.principal || 0) * (l.rate || 0) / 100 / 12).toFixed(2)}万</span></div>
      ${(l.monthly_payment || 0) > 0 ? `<div class="repayment-detail"><span>月还款</span><span>¥${(l.monthly_payment || 0).toFixed(2)}万</span></div>` : ''}
      <div class="repayment-detail"><span>到期</span><span>${l.due_date || '-'}</span></div>
      <div class="card-actions" style="margin-top:12px;">
        <button class="card-btn card-btn-edit" onclick="editLiability('${l.id}')">编辑</button>
        <button class="card-btn card-btn-delete" onclick="deleteLiability('${l.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function renderSummaryCards() {
  const cai = data.assets.filter(a => a.owner === '蔡伟林').reduce((s, a) => s + (a.amount || 0), 0);
  const sun = data.assets.filter(a => a.owner === '孙泳茵').reduce((s, a) => s + (a.amount || 0), 0);
  const types = ['现金', '基金', '股票', '保险', '理财'];
  const byType = types.map(t => data.assets.filter(a => a.type === t).reduce((s, a) => s + (a.amount || 0), 0));
  const totalA = data.assets.reduce((s, a) => s + (a.amount || 0), 0);
  const totalL = data.liabilities.reduce((s, l) => s + (l.principal || 0), 0);
  
  document.getElementById('summaryCards').innerHTML = `
    <div class="summary-card">
      <div class="section-title">按持有人</div>
      <div class="summary-card-row"><span class="summary-card-label">蔡伟林</span><span class="summary-card-value" style="color:var(--success)">¥${cai.toFixed(1)}万</span></div>
      <div class="summary-card-row"><span class="summary-card-label">孙泳茵</span><span class="summary-card-value" style="color:var(--success)">¥${sun.toFixed(1)}万</span></div>
    </div>
    <div class="summary-card">
      <div class="section-title">按类型</div>
      ${types.map((t, i) => `<div class="summary-card-row"><span class="summary-card-label">${t}</span><span class="summary-card-value">¥${byType[i].toFixed(1)}万</span></div>`).join('')}
    </div>
    <div class="summary-card">
      <div class="section-title">总计</div>
      <div class="summary-card-row"><span class="summary-card-label">总资产</span><span class="summary-card-value" style="color:var(--success)">¥${totalA.toFixed(1)}万</span></div>
      <div class="summary-card-row"><span class="summary-card-label">总负债</span><span class="summary-card-value" style="color:var(--danger)">¥${totalL.toFixed(1)}万</span></div>
      <div class="summary-card-row"><span class="summary-card-label">净资产</span><span class="summary-card-value">¥${(totalA - totalL).toFixed(1)}万</span></div>
    </div>
  `;
}

function renderTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + 'Section').classList.add('active');
    };
  });
}

// ===== MODALS =====
function openModal(type) {
  if (type === 'asset') {
    editingAssetId = null;
    document.getElementById('assetModalTitle').textContent = '添加资产';
    document.getElementById('assetOwner').value = '蔡伟林';
    document.getElementById('assetName').value = '';
    document.getElementById('assetAmount').value = '';
    document.getElementById('assetType').value = '现金';
    document.getElementById('assetNote').value = '';
  } else {
    editingLiabilityId = null;
    document.getElementById('liabilityModalTitle').textContent = '添加负债';
    document.getElementById('liabilityName').value = '';
    document.getElementById('liabilityPrincipal').value = '';
    document.getElementById('liabilityRate').value = '';
    document.getElementById('liabilityInterest').value = '';
    document.getElementById('liabilityPayment').value = '';
    document.getElementById('liabilityType').value = '先息后本';
    document.getElementById('liabilityUpdate').value = 'manual';
    document.getElementById('liabilityDue').value = '';
    document.getElementById('liabilityNote').value = '';
  }
  document.getElementById(type + 'Modal').classList.add('active');
}

function closeModal(type) {
  document.getElementById(type + 'Modal').classList.remove('active');
}

function editAsset(id) {
  const a = data.assets.find(x => x.id === id);
  if (!a) return;
  editingAssetId = id;
  document.getElementById('assetModalTitle').textContent = '编辑资产';
  document.getElementById('assetOwner').value = a.owner;
  document.getElementById('assetName').value = a.name;
  document.getElementById('assetAmount').value = a.amount;
  document.getElementById('assetType').value = a.type;
  document.getElementById('assetNote').value = a.note || '';
  document.getElementById('assetModal').classList.add('active');
}

function editLiability(id) {
  const l = data.liabilities.find(x => x.id === id);
  if (!l) return;
  editingLiabilityId = id;
  document.getElementById('liabilityModalTitle').textContent = '编辑负债';
  document.getElementById('liabilityName').value = l.name;
  document.getElementById('liabilityPrincipal').value = l.principal;
  document.getElementById('liabilityRate').value = l.rate;
  document.getElementById('liabilityInterest').value = l.monthly_interest || '';
  document.getElementById('liabilityPayment').value = l.monthly_payment || '';
  document.getElementById('liabilityType').value = l.repayment_type || '先息后本';
  document.getElementById('liabilityUpdate').value = l.update_mode || 'manual';
  document.getElementById('liabilityDue').value = l.due_date || '';
  document.getElementById('liabilityNote').value = l.note || '';
  document.getElementById('liabilityModal').classList.add('active');
}

// ===== CRUD =====
function saveAsset() {
  const owner = document.getElementById('assetOwner').value;
  const name = document.getElementById('assetName').value.trim();
  const amount = parseFloat(document.getElementById('assetAmount').value) || 0;
  const type = document.getElementById('assetType').value;
  const note = document.getElementById('assetNote').value.trim();
  
  if (!name) { showToast('请输入名称'); return; }
  
  const row = { owner, name, amount, type, note, updated_at: new Date().toISOString().slice(0, 10) };
  
  if (editingAssetId) {
    const idx = data.assets.findIndex(x => x.id === editingAssetId);
    if (idx >= 0) data.assets[idx] = { ...data.assets[idx], ...row };
  } else {
    row.id = 'a' + Date.now();
    data.assets.push(row);
  }
  
  autoUpdateZhonghai();
  closeModal('asset');
  renderAll();
  saveToCloud();
}

function deleteAsset(id) {
  if (!confirm('确定删除？')) return;
  data.assets = data.assets.filter(x => x.id !== id);
  renderAll();
  saveToCloud();
}

function saveLiability() {
  const name = document.getElementById('liabilityName').value.trim();
  const principal = parseFloat(document.getElementById('liabilityPrincipal').value) || 0;
  const rate = parseFloat(document.getElementById('liabilityRate').value) || 0;
  const monthly_interest = parseFloat(document.getElementById('liabilityInterest').value) || 0;
  const monthly_payment = parseFloat(document.getElementById('liabilityPayment').value) || 0;
  const repayment_type = document.getElementById('liabilityType').value;
  const update_mode = document.getElementById('liabilityUpdate').value;
  const due_date = document.getElementById('liabilityDue').value.trim();
  const note = document.getElementById('liabilityNote').value.trim();
  
  if (!name) { showToast('请输入名称'); return; }
  
  const row = { name, principal, rate, monthly_interest, monthly_payment, repayment_type, update_mode, due_date, note };
  
  if (editingLiabilityId) {
    const idx = data.liabilities.findIndex(x => x.id === editingLiabilityId);
    if (idx >= 0) data.liabilities[idx] = { ...data.liabilities[idx], ...row };
  } else {
    row.id = 'l' + Date.now();
    data.liabilities.push(row);
  }
  
  autoUpdateZhonghai();
  closeModal('liability');
  renderAll();
  saveToCloud();
}

function deleteLiability(id) {
  if (!confirm('确定删除？')) return;
  data.liabilities = data.liabilities.filter(x => x.id !== id);
  renderAll();
  saveToCloud();
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== START =====
init();
</script>
